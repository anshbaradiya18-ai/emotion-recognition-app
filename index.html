<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-Based Emotion Recognition</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1320;
      color: #f8fafc;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1, p.sub {
      text-align: center;
    }
    h1 { color: #38bdf8; margin-bottom: 6px; }
    p.sub { color: #94a3b8; margin-top: 0; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }
    .card {
      background: #141e30;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .stage {
      position: relative;
      background: #0f172a;
      border-radius: 10px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, canvas {
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #startBtn { background: #2563eb; color: #fff; }
    #stopBtn { background: #dc2626; color: #fff; }
    #statusMsg {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #fbbf24;
      min-height: 18px;
    }
    .bar-row { margin: 10px 0; }
    .bar-bg {
      width: 100%;
      height: 8px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI-Based Emotion Recognition from Facial Expression</h1>
    <p class="sub">Team Binary Minds | Mentor: Dr. Dheeraj Kumar Dixit | MITS Gwalior</p>

    <div class="grid">
      <div class="card">
        <div class="stage">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas"></canvas>
        </div>
        <div class="controls">
          <button id="startBtn" type="button">Start Camera</button>
          <button id="stopBtn" type="button">Stop Camera</button>
        </div>
        <div id="statusMsg"></div>
      </div>

      <div class="card">
        <h3>Real-Time Analytics</h3>
        <p><strong>Detected Emotion:</strong> <span id="topEmotion">Waiting...</span></p>
        <p><strong>Confidence:</strong> <span id="topConf">0%</span></p>
        <p><strong>Inference Latency:</strong> <span id="latency">0 ms</span></p>
        <hr style="border-color: #26354d;" />
        <div id="bars"></div>
      </div>
    </div>
  </div>

  <script>
    const emotions = ["Happy", "Sad", "Angry", "Surprised", "Disgust", "Fear", "Neutral"];
    const barsContainer = document.getElementById("bars");
    emotions.forEach((em) => {
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `
        <div><span id="label-${em}">${em}: 0%</span></div>
        <div class="bar-bg"><div class="bar-fill" id="bar-${em}"></div></div>
      `;
      barsContainer.appendChild(row);
    });

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusMsg = document.getElementById("statusMsg");

    let stream = null;
    let timer = null;
    let busy = false;

    async function startCamera() {
      statusMsg.textContent = "Requesting camera access...";
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Camera API not supported in this browser/context.");
        }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 480, height: 360 },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        canvas.style.display = "block";
        statusMsg.textContent = "Camera active. Analyzing frames...";

        if (timer) clearInterval(timer);
        timer = setInterval(sendFrame, 450);
      } catch (err) {
        statusMsg.textContent = "Camera Error: " + err.message;
      }
    }

    function stopCamera() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
      canvas.style.display = "none";
      statusMsg.textContent = "Camera stopped.";
    }

    async function sendFrame() {
      if (busy || !stream) return;
      busy = true;
      try {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

        const res = await fetch("/api/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: dataUrl })
        });
        if (!res.ok) return;
        const data = await res.json();

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        document.getElementById("latency").textContent = (data.latency_ms ?? 0) + " ms";

        if (data.faces && data.faces.length > 0) {
          const f = data.faces[0];
          const [x, y, w, h] = f.box;
          ctx.strokeStyle = "#22c55e";
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);

          ctx.fillStyle = "#22c55e";
          ctx.font = "16px Arial";
          ctx.fillText(`${f.emotion} (${Math.round(f.confidence * 100)}%)`, x, Math.max(20, y - 8));

          document.getElementById("topEmotion").textContent = f.emotion;
          document.getElementById("topConf").textContent = Math.round(f.confidence * 100) + "%";

          if (f.probabilities) {
            emotions.forEach((em) => {
              const pct = Math.round((f.probabilities[em] || 0) * 100);
              document.getElementById("label-" + em).textContent = `${em}: 0%`.replace("0%", pct + "%");
              document.getElementById("bar-" + em).style.width = pct + "%";
            });
          }
        } else {
          document.getElementById("topEmotion").textContent = "No face detected";
          document.getElementById("topConf").textContent = "0%";
        }
      } catch (e) {
        statusMsg.textContent = "Prediction error: " + e.message;
      } finally {
        busy = false;
      }
    }

    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
  </script>
</body>
</html>
